packages:
  - packages/*
  - apps/*

minimumReleaseAge: 1440
storeDir: .runtime/pnpm-store
cacheDir: .runtime/pnpm-cache
# Decision: .agents/notes/implemented/security/2026-10-04-dependency-overrides.md
overrides:
  "@earendil-works/pi-coding-agent@0.85.1>undici": 8.10.2
  "xcode@3.0.1>uuid": 11.1.1
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "ip-address@>=10.0.0 <10.7.1": 10.7.1
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
# Published artifacts suffice for the current offline probes.
# Transitive lifecycle scripts stay disabled pending explicit review.
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false
  sharp: false
patchedDependencies:
  expo-camera@57.0.5: patches/expo-camera@57.0.5.patch
