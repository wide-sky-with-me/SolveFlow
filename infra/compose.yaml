name: solveflow-local
services:
  postgres:
    image: postgres:17.9-alpine3.23
    environment:
      POSTGRES_DB: solveflow
      POSTGRES_USER: solveflow
      POSTGRES_PASSWORD: ${SOLVEFLOW_APP_DB_PASSWORD:?Run pnpm local:setup}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solveflow -d solveflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SOLVEFLOW_APP_S3_ACCESS_KEY:?Run pnpm local:setup}
      MINIO_ROOT_PASSWORD: ${SOLVEFLOW_APP_S3_SECRET_KEY:?Run pnpm local:setup}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio_data:/data"]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
